<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Englishlab Gs — Mi perfil</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark sm">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="egGradSide" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#f5b942"/><stop offset="1" stop-color="#2dd4bf"/>
            </linearGradient>
          </defs>
          <polygon points="24,7 38,15 38,31 24,39 10,31 10,15" fill="none" stroke="url(#egGradSide)" stroke-width="2.25"/>
          <line x1="18" y1="20" x2="30" y2="20" stroke="url(#egGradSide)" stroke-width="2"/>
          <line x1="18" y1="20" x2="24" y2="30" stroke="url(#egGradSide)" stroke-width="2"/>
          <line x1="30" y1="20" x2="24" y2="30" stroke="url(#egGradSide)" stroke-width="2"/>
          <circle cx="18" cy="20" r="3.4" fill="url(#egGradSide)"/>
          <circle cx="30" cy="20" r="3.4" fill="url(#egGradSide)"/>
          <circle cx="24" cy="30" r="3.4" fill="url(#egGradSide)"/>
        </svg>
      </span>
      <div class="brand-title">Englishlab Gs</div>
    </div>
    <nav>
      <a class="nav-link" id="nav-volver" href="dashboard.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Volver al panel
      </a>
      <a class="nav-link active" href="perfil.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Mi perfil
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logout-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Mi perfil</h1>
        <div class="sub">Tu información de cuenta en Englishlab Gs</div>
      </div>
      <div class="topbar-actions">
        <button class="bell-btn logout-btn-mobile" id="logout-btn-top" title="Cerrar sesión" aria-label="Cerrar sesión">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
        <div class="user-chip">
          <div class="user-avatar" id="chip-avatar">--</div>
          <div>
            <div class="name" id="chip-name">Cargando...</div>
            <div class="role" id="chip-role"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns: 1fr; max-width: 520px;">
      <div class="card">
        <div class="section-title">Datos de la cuenta</div>
        <div id="perfil-datos">
          <div class="list-item"><div class="desc">Nombre</div><div class="title" id="p-nombre">—</div></div>
          <div class="list-item"><div class="desc">Código</div><div class="title" id="p-codigo">—</div></div>
          <div class="list-item"><div class="desc">Rol</div><div class="title" id="p-rol">—</div></div>
          <div class="list-item" id="p-grado-row"><div class="desc">Grado</div><div class="title" id="p-grado">—</div></div>
          <div class="list-item" id="p-salon-row"><div class="desc">Salón</div><div class="title" id="p-salon">—</div></div>
        </div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns: 1fr; max-width: 520px;">
      <div class="card">
        <div class="section-title">Cambiar contraseña</div>
        <form id="form-password">
          <div class="form-field" style="margin-bottom:14px;">
            <label>Nueva contraseña</label>
            <input type="password" id="nueva-password" minlength="6" maxlength="60" required />
          </div>
          <div class="form-field" style="margin-bottom:14px;">
            <label>Confirmar nueva contraseña</label>
            <input type="password" id="confirmar-password" minlength="6" maxlength="60" required />
          </div>
          <button type="submit" class="btn btn-blue">Actualizar contraseña</button>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/env.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
